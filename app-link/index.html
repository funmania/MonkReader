<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MonkReader — Get the app</title>
<meta name="description" content="MonkReader turns classics and your documents into speech, on-device. Download on the App Store or get it on Google Play.">
<meta name="theme-color" content="#121214">

<!--
  MONKREADER SMART LINK — one bio link for Instagram / YouTube / TikTok.
  iPhone/iPad → App Store. Android → Google Play (once ANDROID_URL is set).
  Anything else → both badges, no redirect.

  ANDROID LAUNCH: paste the Play Store URL into ANDROID_URL below. Only change needed.
  TESTING: ?store=ios | ?store=android | ?store=desktop, ?noredirect=1 to preview.
  Deployed from the Privacy repo (GitHub Pages). Keep Marketing/post-kit/app-link/ in sync.
-->
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="canonical" href="https://funmania.github.io/MonkReader/app-link/">
<!-- If you add a custom domain, replace the funmania.github.io URLs below. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="MonkReader">
<meta property="og:title" content="MonkReader — Classics, read aloud">
<meta property="og:description" content="Any PDF, just press play. Download on the App Store or get it on Google Play.">
<meta property="og:url" content="https://funmania.github.io/MonkReader/app-link/">
<meta property="og:image" content="https://funmania.github.io/MonkReader/app-link/icon.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="MonkReader — Classics, read aloud">
<meta name="twitter:description" content="Any PDF, just press play. Download on the App Store or get it on Google Play.">
<meta name="twitter:image" content="https://funmania.github.io/MonkReader/app-link/icon.png">
<style>
  :root {
    --paper: #f7f5f0; --ink: #121214; --soft: rgba(18,18,20,.64);
    --faint: rgba(18,18,20,.44); --hairline: rgba(18,18,20,.12);
    --brass: #9a7b4f; --brass-deep: #7c6240;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121214; --ink: #f2ede3; --soft: rgba(255,255,255,.62);
      --faint: rgba(255,255,255,.42); --hairline: rgba(255,255,255,.14);
      --brass: #c7a87a; --brass-deep: #c7a87a;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, sans-serif;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 20px;
  }
  .card { text-align: center; max-width: 420px; width: 100%; }
  img.icon {
    width: 104px; height: 104px; border-radius: 24px; display: block; margin: 0 auto;
    box-shadow: 0 10px 34px rgba(154,123,79,.35);
    border: 1px solid var(--hairline);
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif; font-weight: 400;
    font-size: 30px; letter-spacing: -.01em; margin: 20px 0 4px;
  }
  p.sub { color: var(--faint); font-size: 16px; margin-bottom: 18px; }
  p.status { color: var(--soft); font-size: 15px; min-height: 24px; margin-bottom: 12px; }
  .spinner {
    width: 22px; height: 22px; margin: 0 auto 12px; border-radius: 50%;
    border: 2.5px solid var(--hairline); border-top-color: var(--brass);
    animation: spin 0.9s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.store {
    display: block; margin: 10px auto; max-width: 280px;
    background: #000; color: #fff; border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px; padding: 10px 16px; text-decoration: none;
  }
  a.store:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  a.store .t1 { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
  a.store .t2 { display: block; font-size: 22px; font-weight: 600; line-height: 1.25; }
  a.store.disabled { opacity: .55; }
  .soon {
    margin: 14px auto 0; max-width: 340px; font-size: 14px; line-height: 1.6;
    color: var(--soft); border: 1px dashed var(--brass);
    border-radius: 14px; padding: 12px 16px;
  }
  .hint { margin: 14px auto 0; max-width: 340px; font-size: 13.5px; line-height: 1.6; color: var(--faint); }
  footer { margin-top: 26px; font-size: 13px; color: var(--faint); }
  footer a { color: var(--soft); text-decoration: none; margin: 0 8px; }
  footer a:hover { color: var(--brass-deep); }
</style>
</head>
<body>
<main class="card">
  <img class="icon" src="icon.png" alt="MonkReader app icon" width="104" height="104" fetchpriority="high">
  <h1>MonkReader</h1>
  <p class="sub">Classics, read aloud.</p>
  <div class="spinner" id="spin" aria-hidden="true"></div>
  <p class="status" id="status" role="status" aria-live="polite">Finding your store…</p>
  <a class="store" id="bApple" href="https://apps.apple.com/app/monkreader/id6804973353"><span class="t1">Download on the</span><span class="t2">App Store</span></a>
  <a class="store" id="bPlay" href="#"><span class="t1">Get it on</span><span class="t2">Google Play</span></a>
  <p class="soon" id="soon" hidden></p>
  <p class="hint" id="hint" hidden>Opened inside Instagram&nbsp;/ TikTok&nbsp;/ YouTube? If the store doesn’t open, tap <strong>···</strong> (top&nbsp;right) → “Open in browser”, then try again.</p>
  <footer><a href="https://funmania.github.io/MonkReader/">Privacy</a>·<a href="https://funmania.github.io/MonkReader/terms.html">Terms</a></footer>
</main>
<script>
(function () {
  "use strict";

  var IOS_URL = "https://apps.apple.com/app/monkreader/id6804973353";
  // TODO(Android launch): paste the Play Store URL the day it goes live, e.g.
  //   "https://play.google.com/store/apps/details?id=com.example.monkreader"
  var ANDROID_URL = "";

  function isAndroid(ua) { return /Android/i.test(ua || ""); }
  function isApplePhone(ua, maxTouch) {
    ua = ua || "";
    if (/iPhone|iPad|iPod/i.test(ua)) return true;
    // iPadOS 13+ in desktop mode reports "Macintosh" — touch gives it away.
    if (/Macintosh|Mac OS X/i.test(ua) && (maxTouch || 0) > 1) return true;
    return /Mobile/i.test(ua) && !isAndroid(ua);
  }
  function isInApp(ua) {
    return /Instagram|FBAN|FBAV|FB_IAB|TikTok|Musical\.ly|Snapchat|YouTube|Line\/|MicroMessenger|WeChat|Weibo|Twitter|Pinterest|LinkedIn|Discord|Telegram|WhatsApp|KAKAOTALK|Naver|ByteDance/i.test(ua || "");
  }

  var ua = navigator.userAgent || "";
  var touch = navigator.maxTouchPoints || 0;
  var params = new URLSearchParams(location.search);
  var force = (params.get("store") || "").toLowerCase();
  var noRedirect = params.has("noredirect") || params.get("redirect") === "0";

  var android = force === "android" ? true : force === "ios" || force === "desktop" ? false : isAndroid(ua);
  var applePhone = force === "ios" ? true : force === "android" || force === "desktop" ? false : isApplePhone(ua, touch);

  var status = document.getElementById("status");
  var spin = document.getElementById("spin");
  var bApple = document.getElementById("bApple");
  var bPlay = document.getElementById("bPlay");
  var soon = document.getElementById("soon");
  var hint = document.getElementById("hint");
  var target = null;

  bApple.href = IOS_URL;
  if (ANDROID_URL) {
    bPlay.href = ANDROID_URL;
  } else {
    bPlay.href = "#";
    bPlay.classList.add("disabled");
    bPlay.setAttribute("aria-disabled", "true");
    soon.textContent = "Coming soon to Google Play — this same link will open it automatically once live.";
    soon.hidden = false;
  }

  // Relevant store first, so the tap target is on top if auto-redirect is blocked.
  if (android && ANDROID_URL) bPlay.parentNode.insertBefore(bPlay, bApple);

  if (android && ANDROID_URL) {
    status.textContent = "Taking you to Google Play…";
    target = ANDROID_URL;
  } else if (android) {
    spin.style.display = "none";
    status.textContent = "Coming soon to Google Play.";
  } else if (applePhone) {
    status.textContent = "Taking you to the App Store…";
    target = IOS_URL;
  } else {
    spin.style.display = "none";
    status.textContent = "Get MonkReader.";
  }

  if (isInApp(ua) && (applePhone || android)) hint.hidden = false;

  if (target && !noRedirect) {
    setTimeout(function () { location.replace(target); }, 450);
    setTimeout(function () {
      spin.style.display = "none";
      status.textContent = "Not redirected? Tap below.";
    }, 2600);
  } else {
    spin.style.display = "none";
  }
})();
</script>
</body>
</html>
